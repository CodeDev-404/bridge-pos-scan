name: bridge_pos_scan
description: "Bridge+ POS Scan - Lector QR/Código de barras para sistema de ventas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Escaneo QR y Barcode
  mobile_scanner: ^7.4.0

  # Backend
  supabase_flutter: ^2.8.0

  # HTTP para SUNAT
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Formateo
  intl: ^0.20.2

  # UI
  cached_network_image: ^3.4.1

  # UUID para sesiones
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
